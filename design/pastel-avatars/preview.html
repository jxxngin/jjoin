<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파스텔 유령 프로필</title><style>body{margin:40px;background:#faf9f7;color:#34313c;font-family:system-ui;text-align:center}main{max-width:850px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}img{width:100%;max-width:200px;border-radius:50%}button{padding:12px 24px;margin:25px;border:0;border-radius:20px;background:#ded5ef;cursor:pointer}#sample{width:96px;display:block;margin:auto}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}</style><main><h1>파스텔 유령 프로필</h1><div class="grid"><div><img src="ghost-lavender.png" alt="lavender"><p>lavender</p></div><div><img src="ghost-sky.png" alt="sky"><p>sky</p></div><div><img src="ghost-mint.png" alt="mint"><p>mint</p></div><div><img src="ghost-pink.png" alt="pink"><p>pink</p></div><div><img src="ghost-peach.png" alt="peach"><p>peach</p></div><div><img src="ghost-butter.png" alt="butter"><p>butter</p></div></div><button id="random">랜덤 프로필 뽑기</button><img id="sample" alt="랜덤 프로필"></main><script>const colors=["lavender","sky","mint","pink","peach","butter"];const sample=document.getElementById("sample");function pick(){const c=colors[Math.floor(Math.random()*colors.length)];sample.src="ghost-"+c+".png"}document.getElementById("random").onclick=pick;pick();</script></html>
