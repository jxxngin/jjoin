# 백엔드 이미지를 만들어 GHCR(ghcr.io/jxxngin/jjoin-backend)에 올리고, 서버가 설정돼 있으면 SSH로 새 이미지를 띄운다.
# - 이미지는 x86(E2.1.Micro)·ARM(A1.Flex) 서버 모두에서 돌도록 두 가지로 만든다.
# - 서버 배포는 GitHub Secrets에 DEPLOY_HOST·DEPLOY_USER·DEPLOY_SSH_KEY가 있을 때만 한다. (backend/DEPLOY.md)
name: 백엔드 배포

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트 (단위 + Postgres 통합)
        working-directory: backend
        run: ./gradlew test --console=plain

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 이미지 만들고 올리기
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jxxngin/jjoin-backend:latest
            ghcr.io/jxxngin/jjoin-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 서버에 설정 파일(compose·Caddyfile)을 올리고 .env 값을 맞춘 뒤 새 이미지를 띄운다.
  # Secret API_DOMAIN(예: 152-70-1-2.sslip.io)이 있으면 Caddy(HTTPS 입구, B3 문의 API)도 켠다.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      # 서버 .env에 넣을 값. 비어 있으면 서버의 기존 값을 건드리지 않는다.
      API_DOMAIN: ${{ secrets.API_DOMAIN }}
      AUTOFIX_SECRET: ${{ secrets.AUTOFIX_SECRET }}
      # 로그인 토큰 검증용 Supabase 주소 (공개 값, 브라우저에도 보이는 주소)
      SUPABASE_URL: https://pgkonpzgvuukknagplco.supabase.co
    steps:
      - name: 서버 설정이 없으면 건너뜀
        if: env.DEPLOY_HOST == ''
        run: echo "DEPLOY_HOST가 없어 서버 배포를 건너뜁니다. (이미지는 GHCR에 올라갔어요)"

      - uses: actions/checkout@v5
        if: env.DEPLOY_HOST != ''
        with:
          sparse-checkout: backend/deploy

      - name: 설정 파일 올리기 (docker-compose.yml, Caddyfile)
        if: env.DEPLOY_HOST != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: backend/deploy/docker-compose.yml,backend/deploy/Caddyfile
          target: jjoin
          strip_components: 2

      - name: 서버에서 새 이미지 띄우기
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_DOMAIN,AUTOFIX_SECRET,SUPABASE_URL
          script: |
            set -e
            cd ~/jjoin

            # .env의 KEY=값을 맞춘다. 값이 비면 그대로 둔다. (같은 값이면 바뀌는 것 없음)
            set_env() {
              [ -n "$2" ] || return 0
              { grep -v "^$1=" .env || true; printf '%s=%s\n' "$1" "$2"; } > .env.new && mv .env.new .env
            }
            set_env SUPABASE_URL "$SUPABASE_URL"
            set_env AUTOFIX_SECRET "$AUTOFIX_SECRET"
            set_env API_DOMAIN "$API_DOMAIN"
            chmod 600 .env
            # Compose는 셸 환경변수를 .env보다 먼저 쓴다. Secret이 비어 SSH로 빈 값이 넘어오면
            # .env에 저장된 도메인 대신 빈 값(→ localhost)으로 Caddy가 다시 만들어지므로, 여기서부터는 .env만 쓰게 지운다.
            unset API_DOMAIN AUTOFIX_SECRET SUPABASE_URL

            docker compose pull backend
            docker compose up -d backend
            for i in $(seq 1 30); do
              if curl -fsS localhost:8080/actuator/health | grep -q '"UP"'; then echo "백엔드 정상"; break; fi
              [ "$i" = 30 ] && { echo "백엔드가 60초 안에 정상(UP)이 되지 않았어요"; docker compose logs --tail 50 backend; exit 1; }
              sleep 2
            done

            if grep -q '^API_DOMAIN=.' .env; then
              # Oracle Ubuntu 이미지는 서버 방화벽(iptables)이 22번만 열어 둔다. 80(인증서 발급)·443(API)을 연다.
              for port in 80 443; do
                sudo iptables -C INPUT -p tcp --dport "$port" -j ACCEPT 2>/dev/null \
                  || sudo iptables -I INPUT 1 -p tcp --dport "$port" -j ACCEPT
              done
              sudo netfilter-persistent save >/dev/null 2>&1 || true

              # Caddyfile은 파일 하나를 연결(bind)해 두어서, 새로 올린 파일은 컨테이너를 다시 만들어야 반영된다. 바뀐 때만 다시 만든다.
              caddy_sum=$(sha256sum Caddyfile | cut -d' ' -f1)
              if [ "$caddy_sum" != "$(cat .caddyfile.sha256 2>/dev/null)" ]; then
                docker compose --profile api up -d --force-recreate caddy
                echo "$caddy_sum" > .caddyfile.sha256
              else
                docker compose --profile api up -d caddy
              fi
              # 바깥에서 HTTPS로 닿는지 본다. 인증 없이 부르면 401이 정상이다.
              # (첫 인증서 발급은 시간이 걸리고, Oracle 콘솔의 보안 목록에서 80·443이 닫혀 있으면 실패한다. 배포는 실패로 치지 않는다)
              domain=$(grep '^API_DOMAIN=' .env | cut -d= -f2-)
              for i in $(seq 1 20); do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "https://$domain/api/inquiries" || true)
                if [ "$code" = 401 ]; then echo "HTTPS 입구 정상 (인증 없이 401)"; break; fi
                [ "$i" = 20 ] && { echo "::warning::HTTPS 입구 확인 실패 (마지막 응답: $code). Oracle 보안 목록의 80·443과 Caddy 로그를 확인하세요."; docker compose logs --tail 30 caddy; }
                sleep 3
              done
            fi

            docker image prune -f
