# Java Spring 백엔드(backend/) 빌드와 테스트. 통합 테스트는 Testcontainers가 Docker로 Postgres를 띄워 돌린다.
name: 백엔드 테스트

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트 (단위 + Postgres 통합)
        run: ./gradlew test --console=plain

      - name: 결과 요약
        if: always()
        run: |
          for f in build/test-results/test/*.xml; do
            grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          done

      - name: 이미지 빌드 확인
        run: docker build -t jjoin-backend .
